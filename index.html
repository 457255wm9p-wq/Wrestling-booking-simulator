<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrestling Booking Simulator — Local Edition</title>
<style>
:root{--bg:#101116;--panel:#191b23;--panel2:#20232d;--line:#303441;--text:#f4f5f7;--muted:#a4a8b5;--red:#ef4444;--gold:#f5c451;--green:#65d6a2;--blue:#83b9ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#25202b 0,#101116 48%);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#282b36;color:var(--text);padding:9px 12px;border-radius:9px}button:hover{border-color:#777f93;background:#333746}button.primary{background:var(--red);border-color:var(--red);font-weight:750}button.subtle{background:transparent}button.danger{color:#ff9a9a}input,select,textarea{width:100%;background:#101218;color:var(--text);border:1px solid var(--line);padding:10px;border-radius:8px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(24px,4vw,36px);margin-bottom:4px;letter-spacing:-.8px}h2{font-size:19px;margin-bottom:14px}h3{font-size:15px;margin-bottom:8px}.muted{color:var(--muted)}.tiny{font-size:12px}.shell{max-width:1400px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#f87171,#991b1b);display:grid;place-items:center;font-size:24px;font-weight:900;box-shadow:0 8px 28px #ef444433}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.nav{display:flex;gap:7px;overflow:auto;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}.nav button{white-space:nowrap}.nav button.active{background:#fff;color:#14151a;border-color:#fff;font-weight:750}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat,.panel,.card{background:linear-gradient(145deg,#1c1e27,#171920);border:1px solid var(--line);border-radius:14px;padding:15px}.stat .number{font-size:28px;font-weight:850;letter-spacing:-1px}.stat .label{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.stack{display:grid;gap:14px}.row{display:flex;gap:10px;align-items:center}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.wrap{display:flex;flex-wrap:wrap;gap:8px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field{margin-bottom:10px}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);padding:3px 8px;border-radius:999px;color:var(--muted);font-size:11px;gap:4px}.pill.red{border-color:#773b42;color:#ffaaaa;background:#3b1f25}.pill.gold{border-color:#6e592a;color:#f8d77d;background:#342b19}.pill.green{border-color:#27664c;color:#9af0c4;background:#173126}.person{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #2b2e38}.person:last-child{border-bottom:0}.avatar{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#3d4252,#242631);font-weight:850;font-size:16px;flex-shrink:0}.person-main{flex:1;min-width:0}.person-main strong{display:block}.person-main small{color:var(--muted)}.rating{font-size:21px;font-weight:850}.meter{height:5px;background:#30333d;border-radius:99px;overflow:hidden;margin-top:6px}.meter span{display:block;height:100%;background:linear-gradient(90deg,#f87171,#f5c451)}.empty{padding:22px;border:1px dashed #414553;border-radius:10px;text-align:center;color:var(--muted)}.matchline{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #2b2e38}.matchline:last-child{border-bottom:0}.matchside{font-weight:750}.matchside:last-child{text-align:right}.versus{font-size:11px;color:var(--muted)}.winner{color:var(--green)}.notice{border:1px solid #6e592a;background:#342b19;color:#f8d77d;padding:11px;border-radius:9px;font-size:13px}.result{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.result .card{padding:12px}.result strong{font-size:24px;display:block}.history-item{border-left:2px solid #5d6475;padding:0 0 14px 13px;margin-left:5px}.history-item:last-child{padding-bottom:0}.history-item strong{display:block}.hidden{display:none!important}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.section-head h2{margin:0}.footer{color:var(--muted);font-size:11px;text-align:center;margin:22px 0 6px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#f5f5f5;color:#111;padding:10px 16px;border-radius:9px;font-weight:700;box-shadow:0 8px 30px #0007;z-index:20}.modal-bg{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:10}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#191b23;border:1px solid #454957;border-radius:16px;padding:20px;box-shadow:0 24px 80px #0009}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h2{margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.tagline{font-size:13px;color:var(--muted)}.champ{color:var(--gold)}.progress{height:8px;background:#2a2d37;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}@media(max-width:850px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{padding:14px}.top{align-items:flex-start;flex-direction:column}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.grid2,.grid3{grid-template-columns:1fr}.result{grid-template-columns:1fr}.stat .number{font-size:24px}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><div class="logo">W</div><div><h1>WRESTLING BOOKING SIMULATOR</h1><div class="tagline">LOCAL EDITION · Deine Promotion. Deine Regeln.</div></div></div>
    <div class="top-actions">
      <button onclick="exportSave()">↗ Export Save</button>
      <button onclick="document.getElementById('importFile').click()">↙ Import Save</button>
      <input id="importFile" type="file" accept=".json,application/json" class="hidden" onchange="importSave(event)">
      <button onclick="openSettings()">⚙ Einstellungen</button>
    </div>
  </header>
  <nav class="nav" id="nav"></nav>
  <div id="app"></div>
  <div class="footer">Lokaler Spielstand · Keine Anmeldung · Keine Serverkosten · Änderungen werden in diesem Browser gespeichert</div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
const STORAGE_KEY='wbs_local_v1';
const DEFAULT_STATE={
 version:1, promotion:'Riot Pro Wrestling', mode:'career', week:1, season:1, money:250000, fans:120000,
 roster:[
  {id:'w1',name:'Ace Mercer',brand:'Original',role:'Face',overall:88,ring:91,mic:82,charisma:88,pop:82,stamina:90,morale:78,alignment:'Face',status:'Healthy',contract:'Exclusive'},
  {id:'w2',name:'Damien Cross',brand:'Original',role:'Heel',overall:91,ring:89,mic:94,charisma:92,pop:87,stamina:84,morale:72,alignment:'Heel',status:'Healthy',contract:'Exclusive'},
  {id:'w3',name:'Nova Storm',brand:'Original',role:'Face',overall:84,ring:88,mic:76,charisma:85,pop:70,stamina:92,morale:85,alignment:'Face',status:'Healthy',contract:'Exclusive'},
  {id:'w4',name:'Viktor Voss',brand:'Original',role:'Heel',overall:86,ring:90,mic:79,charisma:83,pop:74,stamina:88,morale:68,alignment:'Heel',status:'Healthy',contract:'Exclusive'},
  {id:'w5',name:'Jett Ryder',brand:'Original',role:'Face',overall:78,ring:82,mic:73,charisma:80,pop:61,stamina:94,morale:88,alignment:'Face',status:'Healthy',contract:'Exclusive'},
  {id:'w6',name:'The Bruiser',brand:'Original',role:'Heel',overall:81,ring:78,mic:68,charisma:84,pop:65,stamina:79,morale:75,alignment:'Heel',status:'Healthy',contract:'Exclusive'},
  {id:'w7',name:'Luna Vale',brand:'Original',role:'Face',overall:83,ring:86,mic:81,charisma:87,pop:72,stamina:88,morale:80,alignment:'Face',status:'Healthy',contract:'Exclusive'},
  {id:'w8',name:'Rex Royale',brand:'Original',role:'Heel',overall:89,ring:86,mic:91,charisma:90,pop:81,stamina:82,morale:70,alignment:'Heel',status:'Healthy',contract:'Exclusive'},
  {id:'w9',name:'Mason Steel',brand:'Original',role:'Face',overall:75,ring:78,mic:70,charisma:74,pop:54,stamina:90,morale:84,alignment:'Face',status:'Healthy',contract:'Exclusive'},
  {id:'w10',name:'Silas King',brand:'Original',role:'Heel',overall:80,ring:81,mic:84,charisma:78,pop:63,stamina:86,morale:76,alignment:'Heel',status:'Healthy',contract:'Exclusive'},
  {id:'w11',name:'Skye Phoenix',brand:'Original',role:'Face',overall:79,ring:84,mic:72,charisma:83,pop:60,stamina:91,morale:87,alignment:'Face',status:'Healthy',contract:'Exclusive'},
  {id:'w12',name:'Graves',brand:'Original',role:'Heel',overall:85,ring:87,mic:75,charisma:86,pop:73,stamina:80,morale:73,alignment:'Heel',status:'Healthy',contract:'Exclusive'}
 ],
 titles:[{id:'t1',name:'RPW World Championship',championId:'w2',history:[{name:'Damien Cross',week:1,event:'Current champion'}]},{id:'t2',name:'RPW National Championship',championId:'w4',history:[{name:'Viktor Voss',week:1,event:'Current champion'}]},{id:'t3',name:'RPW Tag Team Championship',championId:null,history:[]}],
 storylines:[{id:'s1',name:'The Champion’s Shadow',participants:['w1','w2'],phase:'Escalation',heat:78,progress:45,notes:'Ace Mercer fordert Damien Cross heraus. Der Champion sucht jeden Vorteil.'},{id:'s2',name:'No One Can Stop Voss',participants:['w3','w4'],phase:'Build',heat:61,progress:25,notes:'Nova Storm will beweisen, dass Voss nicht unbesiegbar ist.'}],
 shows:[],history:[{id:'h1',week:1,title:'Karriere gestartet',detail:'Willkommen bei Riot Pro Wrestling. Deine erste Show wartet.',type:'system'}],
 nextId:100
};
let state=loadState();
let page='dashboard';
let draftMatches=[];
let draftSegments=[];
let selectedShowName='RPW Friday Night Riot';
const pages=[['dashboard','▦','Dashboard'],['roster','♟','Roster'],['booking','▤','Show booken'],['storylines','⌘','Storylines'],['titles','♛','Titel'],['history','◷','Historie']];
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadState(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));if(x&&x.version===1)return x}catch(e){}return clone(DEFAULT_STATE)}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){toast('Speichern fehlgeschlagen – bitte Save exportieren.')} }
function persist(){saveState();render()}
function id(prefix='x'){state.nextId=(state.nextId||100)+1;return prefix+state.nextId}
function person(id){return state.roster.find(w=>w.id===id)}
function title(id){return state.titles.find(t=>t.id===id)}
function wrestlerOptions(selected=''){return state.roster.map(w=>`<option value="${w.id}" ${w.id===selected?'selected':''}>${esc(w.name)} (${w.overall})</option>`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(n){return n.split(/\s+/).map(s=>s[0]).slice(0,2).join('').toUpperCase()}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML='',2400)}
function setPage(p){page=p;render()}
function render(){
 document.getElementById('nav').innerHTML=pages.map(([p,ic,n])=>`<button class="${page===p?'active':''}" onclick="setPage('${p}')">${ic} ${n}</button>`).join('');
 const root=document.getElementById('app');
 const map={dashboard:dashboardPage,roster:rosterPage,booking:bookingPage,storylines:storylinesPage,titles:titlesPage,history:historyPage};
 root.innerHTML=(map[page]||dashboardPage)();
}
function stat(label,num,sub=''){return `<div class="stat"><div class="label">${label}</div><div class="number">${num}</div>${sub?`<div class="tiny muted">${sub}</div>`:''}</div>`}
function dashboardPage(){
 const last=state.shows[state.shows.length-1];
 const avg=state.shows.length?Math.round(state.shows.reduce((a,s)=>a+s.rating,0)/state.shows.length):0;
 const champ=state.titles.find(t=>t.name.includes('World'));
 const recent=state.history.slice(-5).reverse();
 return `<div class="between" style="margin-bottom:16px;align-items:flex-start"><div><div class="pill red">${state.mode==='career'?'CAREER MODE':'SANDBOX MODE'}</div><h2 style="font-size:26px;margin:8px 0 3px">${esc(state.promotion)}</h2><div class="muted">Season ${state.season} · Woche ${state.week} · Willkommen zurück, Booker.</div></div><button class="primary" onclick="setPage('booking')">＋ Neue Show buchen</button></div>
 <div class="stats">${stat('ROSTER',state.roster.length,'aktive Wrestler')}${stat('FANS',fmt(state.fans),'Publikumsbasis')}${stat('SHOWS GEBUCHT',state.shows.length,'abgeschlossene Shows')}${stat('Ø SHOW RATING',avg?avg+'/100':'—','über alle Shows')}</div>
 <div class="layout"><div class="stack">
  <section class="panel"><div class="section-head"><h2>Aktuelle Champions</h2><button class="subtle tiny" onclick="setPage('titles')">Alle Titel →</button></div>${state.titles.map(t=>`<div class="person"><div class="avatar">♛</div><div class="person-main"><strong>${esc(t.name)}</strong><small>${t.championId?esc(person(t.championId)?.name||'Unbekannt'):'Vacant'}</small></div><span class="pill gold">${t.championId?'CHAMPION':'VACANT'}</span></div>`).join('')}</section>
  <section class="panel"><div class="section-head"><h2>Aktive Storylines</h2><button class="subtle tiny" onclick="setPage('storylines')">Verwalten →</button></div>${state.storylines.length?state.storylines.slice(0,3).map(storyCard).join(''):'<div class="empty">Noch keine Storylines angelegt.</div>'}</section>
 </div><div class="stack">
  <section class="panel"><div class="section-head"><h2>Letzte Show</h2>${last?`<span class="pill green">${last.rating}/100</span>`:''}</div>${last?`<h3>${esc(last.name)}</h3><div class="result"><div class="card"><span class="muted tiny">Showrating</span><strong>${last.rating}</strong></div><div class="card"><span class="muted tiny">Matches</span><strong>${last.matches.length}</strong></div><div class="card"><span class="muted tiny">Crowd</span><strong>${last.crowd>=75?'🔥':last.crowd>=55?'👏':'😐'}</strong></div></div><p class="muted tiny" style="margin:12px 0 0">${esc(last.recap||'Show abgeschlossen.')}</p>`:'<div class="empty">Noch keine Shows abgeschlossen. Deine erste Show wartet.</div>'}</section>
  <section class="panel"><div class="section-head"><h2>Booking-Historie</h2><button class="subtle tiny" onclick="setPage('history')">Alle →</button></div>${recent.length?recent.map(h=>`<div class="history-item"><strong>${esc(h.title)}</strong><div class="tiny muted">${esc(h.detail)}</div></div>`).join(''):'<div class="empty">Noch keine Ereignisse.</div>'}</section>
 </div></div>`;
}
function fmt(n){return new Intl.NumberFormat('de-AT',{notation:n>=100000?'compact':'standard',maximumFractionDigits:1}).format(n)}
function storyCard(s){return `<div class="card" style="margin-bottom:9px"><div class="between"><strong>${esc(s.name)}</strong><span class="pill ${s.heat>=75?'red':''}">Heat ${s.heat}</span></div><div class="tiny muted" style="margin:5px 0 8px">${s.participants.map(x=>esc(person(x)?.name||'Unbekannt')).join(' vs. ')} · ${esc(s.phase)}</div><div class="progress"><span style="width:${s.progress}%"></span></div><div class="between tiny muted" style="margin-top:6px"><span>Story-Fortschritt</span><span>${s.progress}%</span></div></div>`}
function rosterPage(){
 return `<div class="section-head"><div><h2>Roster Management</h2><div class="muted tiny">Verwalte Fähigkeiten, Alignment, Moral und Popularität.</div></div><button class="primary" onclick="openWrestler()">＋ Wrestler hinzufügen</button></div>
 <div class="panel" style="margin-bottom:14px"><div class="grid3"><div class="field"><label>Suche</label><input id="rosterSearch" placeholder="Name suchen…" oninput="filterRoster()"></div><div class="field"><label>Alignment</label><select id="rosterAlign" onchange="filterRoster()"><option value="">Alle</option><option>Face</option><option>Heel</option><option>Tweener</option></select></div><div class="field"><label>Sortierung</label><select id="rosterSort" onchange="filterRoster()"><option value="overall">Overall (hoch → niedrig)</option><option value="pop">Popularität</option><option value="morale">Moral</option><option value="name">Name A–Z</option></select></div></div></div>
 <div id="rosterList" class="panel">${rosterRows(state.roster)}</div>`;
}
function rosterRows(list){return list.length?list.map(w=>`<div class="person"><div class="avatar">${initials(w.name)}</div><div class="person-main"><strong>${esc(w.name)} <span class="pill">${esc(w.alignment)}</span> ${w.status!=='Healthy'?'<span class="pill red">'+esc(w.status)+'</span>':''}</strong><small>${esc(w.brand||'Independent')} · Mic ${w.mic} · Ring ${w.ring} · Pop ${w.pop} · Moral ${w.morale}</small><div class="meter"><span style="width:${w.overall}%"></span></div></div><div class="rating">${w.overall}</div><button onclick="openWrestler('${w.id}')">Bearbeiten</button></div>`).join(''):'<div class="empty">Keine Wrestler gefunden.</div>'}
function filterRoster(){const q=(document.getElementById('rosterSearch')?.value||'').toLowerCase(),a=document.getElementById('rosterAlign')?.value||'',s=document.getElementById('rosterSort')?.value||'overall';let list=state.roster.filter(w=>w.name.toLowerCase().includes(q)&&(!a||w.alignment===a));list.sort((x,y)=>s==='name'?x.name.localeCompare(y.name):y[s]-x[s]);document.getElementById('rosterList').innerHTML=rosterRows(list)}
function bookingPage(){
 const active=state.roster.filter(w=>w.status==='Healthy');
 if(!draftMatches.length)draftMatches=[{id:'dm1',type:'Singles Match',a:active[0]?.id||'',b:active[1]?.id||'',finish:'Clean',winner:'',story:'',titleId:''}];
 if(!draftSegments.length)draftSegments=[{id:'ds1',type:'Promo',title:'Opening promo',participants:[active[0]?.id||''],duration:5}];
 return `<div class="between" style="margin-bottom:14px;align-items:flex-start"><div><h2>Show Booking</h2><div class="muted tiny">Plane die Card, prüfe sie und simuliere deine Show.</div></div><span class="pill">Season ${state.season} · Week ${state.week}</span></div>
 <div class="layout"><div class="stack">
  <section class="panel"><h2>Show Details</h2><div class="field"><label>Showname</label><input id="showName" value="${esc(selectedShowName)}" oninput="selectedShowName=this.value"></div><div class="grid2"><div class="field"><label>Show-Typ</label><select id="showType"><option>Weekly TV</option><option>Special</option><option>Pay-Per-View</option></select></div><div class="field"><label>Venue</label><select id="venue"><option>Small Arena</option><option>TV Studio</option><option>Major Arena</option><option>Stadium</option></select></div></div></section>
  <section class="panel"><div class="section-head"><h2>Matchcard</h2><button onclick="addDraftMatch()">＋ Match</button></div><div id="draftMatchList">${draftMatches.map((m,i)=>matchEditor(m,i)).join('')}</div></section>
  <section class="panel"><div class="section-head"><h2>Segmente & Promos</h2><button onclick="addDraftSegment()">＋ Segment</button></div><div id="draftSegmentList">${draftSegments.map((s,i)=>segmentEditor(s,i)).join('')}</div></section>
  <div class="wrap"><button class="primary" onclick="simulateShow()">▶ Show abschließen & bewerten</button><button onclick="resetDraft()">Card zurücksetzen</button></div>
 </div><div class="stack">
  <section class="panel"><h2>Live Card Check</h2><div class="muted tiny" style="margin-bottom:10px">Ein kurzer Überblick über deine Planung.</div><div id="cardCheck">${cardCheckHTML()}</div></section>
  <section class="panel"><h2>Wie wird bewertet?</h2><div class="tiny muted">Matchqualität 30% · Storytelling 25% · Crowd 20% · Pacing 15% · Booking-Logik 10%</div><div class="meter" style="height:8px;margin:12px 0"><span style="width:30%"></span></div><div class="tiny muted">Die Engine berechnet Ratings aus Fähigkeiten, Storyline-Heat, Finish, Card-Aufbau und Segmenten. Resultate werden in deiner Historie gespeichert.</div></section>
  <section class="panel"><h2>Booking-Modus</h2><div class="field"><label>Ergebnis bestimmen</label><select id="resultMode"><option value="manual">Ich wähle die Sieger</option><option value="auto">Engine entscheidet</option></select></div><div class="notice">Tipp: Ein cleanes Finish stärkt den Sieger meist stärker. Ein Eingriff kann Heat erzeugen, aber auch die Glaubwürdigkeit beeinflussen.</div></section>
 </div></div>`;
}
function matchEditor(m,i){return `<div class="card" style="margin-bottom:10px"><div class="between" style="margin-bottom:10px"><strong>Match ${i+1}</strong><button class="danger tiny" onclick="removeDraftMatch('${m.id}')">Entfernen</button></div><div class="grid2"><div class="field"><label>Matchart</label><select onchange="updateMatch('${m.id}','type',this.value)">${['Singles Match','Tag Team Match','Triple Threat','Fatal 4-Way','No DQ','Ladder Match','Main Event'].map(x=>`<option ${m.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Finish</label><select onchange="updateMatch('${m.id}','finish',this.value)">${['Clean','Roll-up','Interference','DQ','Count-out','No Contest'].map(x=>`<option ${m.finish===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="grid2"><div class="field"><label>Wrestler A</label><select onchange="updateMatch('${m.id}','a',this.value)">${wrestlerOptions(m.a)}</select></div><div class="field"><label>Wrestler B</label><select onchange="updateMatch('${m.id}','b',this.value)">${wrestlerOptions(m.b)}</select></div></div><div class="grid2"><div class="field"><label>Storyline (optional)</label><select onchange="updateMatch('${m.id}','story',this.value)"><option value="">Keine</option>${state.storylines.map(s=>`<option value="${s.id}" ${m.story===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Titelmatch (optional)</label><select onchange="updateMatch('${m.id}','titleId',this.value)"><option value="">Kein Titel</option>${state.titles.map(t=>`<option value="${t.id}" ${m.titleId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div><div class="field"><label>Sieger (manuell)</label><select onchange="updateMatch('${m.id}','winner',this.value)"><option value="">Engine / noch offen</option><option value="${m.a}" ${m.winner===m.a?'selected':''}>${esc(person(m.a)?.name||'Wrestler A')}</option><option value="${m.b}" ${m.winner===m.b?'selected':''}>${esc(person(m.b)?.name||'Wrestler B')}</option></select></div></div>`}
function segmentEditor(s,i){return `<div class="card" style="margin-bottom:10px"><div class="between" style="margin-bottom:10px"><strong>Segment ${i+1}</strong><button class="danger tiny" onclick="removeDraftSegment('${s.id}')">Entfernen</button></div><div class="grid2"><div class="field"><label>Typ</label><select onchange="updateSegment('${s.id}','type',this.value)">${['Promo','Backstage','Interview','Brawl','Video Package','Contract Signing'].map(x=>`<option ${s.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Dauer (Min.)</label><input type="number" min="1" max="30" value="${s.duration}" onchange="updateSegment('${s.id}','duration',Number(this.value))"></div></div><div class="field"><label>Titel des Segments</label><input value="${esc(s.title)}" onchange="updateSegment('${s.id}','title',this.value)"></div><div class="field"><label>Wrestler</label><select multiple size="3" onchange="updateSegment('${s.id}','participants',Array.from(this.selectedOptions).map(o=>o.value))">${state.roster.map(w=>`<option value="${w.id}" ${(s.participants||[]).includes(w.id)?'selected':''}>${esc(w.name)}</option>`).join('')}</select><div class="tiny muted">Mehrfachauswahl: am Desktop mit Ctrl/Cmd; am iPhone Optionen antippen.</div></div></div>`}
function cardCheckHTML(){const healthy=state.roster.filter(w=>w.status==='Healthy');const issues=[];draftMatches.forEach((m,i)=>{if(!m.a||!m.b)issues.push(`Match ${i+1}: Teilnehmer fehlen`);if(m.a===m.b)issues.push(`Match ${i+1}: Ein Wrestler kann nicht gegen sich selbst antreten`);if(person(m.a)?.status!=='Healthy'||person(m.b)?.status!=='Healthy')issues.push(`Match ${i+1}: Verletzungsstatus prüfen`)});return `<div class="result"><div class="card"><span class="muted tiny">Matches</span><strong>${draftMatches.length}</strong></div><div class="card"><span class="muted tiny">Segmente</span><strong>${draftSegments.length}</strong></div><div class="card"><span class="muted tiny">Roster</span><strong>${healthy.length}</strong></div></div>${issues.length?`<div class="notice" style="margin-top:12px">${issues.map(esc).join('<br>')}</div>`:'<p class="tiny" style="color:var(--green);margin:12px 0 0">✓ Keine offensichtlichen Card-Probleme erkannt.</p>'}`}
function updateMatch(mid,key,val){const m=draftMatches.find(x=>x.id===mid);if(m){m[key]=val;if(key==='a'&&m.winner===m.b)m.winner='';if(key==='b'&&m.winner===m.a)m.winner='';renderBookingPreserving()}}
function updateSegment(sid,key,val){const s=draftSegments.find(x=>x.id===sid);if(s){s[key]=val;renderBookingPreserving()}}
function renderBookingPreserving(){const a=document.getElementById('draftMatchList'),b=document.getElementById('draftSegmentList'),c=document.getElementById('cardCheck');if(a)a.innerHTML=draftMatches.map((m,i)=>matchEditor(m,i)).join('');if(b)b.innerHTML=draftSegments.map((s,i)=>segmentEditor(s,i)).join('');if(c)c.innerHTML=cardCheckHTML()}
function addDraftMatch(){draftMatches.push({id:id('dm'),type:'Singles Match',a:state.roster[0]?.id||'',b:state.roster[1]?.id||'',finish:'Clean',winner:'',story:'',titleId:''});renderBookingPreserving()}
function removeDraftMatch(mid){draftMatches=draftMatches.filter(m=>m.id!==mid);renderBookingPreserving()}
function addDraftSegment(){draftSegments.push({id:id('ds'),type:'Promo',title:'New segment',participants:[],duration:5});renderBookingPreserving()}

function resetDraft(){draftMatches=[];draftSegments=[];selectedShowName='RPW Friday Night Riot';render()}
function simulateShow(){
 const name=(document.getElementById('showName')?.value||selectedShowName||'Weekly Show').trim();
 const showType=document.getElementById('showType')?.value||'Weekly TV',venue=document.getElementById('venue')?.value||'Small Arena',mode=document.getElementById('resultMode')?.value||'manual';
 if(!name){toast('Bitte gib der Show einen Namen.');return}
 if(!draftMatches.length){toast('Füge mindestens ein Match hinzu.');return}
 for(const m of draftMatches){if(!m.a||!m.b||m.a===m.b){toast('Bitte prüfe die Teilnehmer jedes Matches.');return}if(!person(m.a)||!person(m.b)){toast('Ein Wrestler fehlt im Roster.');return}}
 const matchResults=[];let matchScores=[];
 draftMatches.forEach((m,i)=>{
  const a=person(m.a),b=person(m.b),story=state.storylines.find(s=>s.id===m.story);
  let chemistry=clamp(100-Math.abs(a.ring-b.ring)*1.3+rand(-8,12),35,100);
  let storyScore=story?story.heat:45;
  let finishScore=({Clean:82,'Roll-up':65,Interference:70,DQ:54,'Count-out':48,'No Contest':43})[m.finish]||65;
  let quality=clamp(Math.round((a.ring+b.ring)/2*.35+chemistry*.2+storyScore*.2+finishScore*.15+((a.stamina+b.stamina)/2)*.1+rand(-7,7)),20,100);
  let winner=m.winner&&mode==='manual'?m.winner:(mode==='manual'&&m.winner?m.winner:(Math.random()<(a.overall/(a.overall+b.overall))?a.id:b.id));
  if(mode==='manual'&&!m.winner)winner=(Math.random()<(a.overall/(a.overall+b.overall))?a.id:b.id);
  const loser=winner===a.id?b:a,win=winner===a.id?a:b;
  let momentum= m.finish==='Clean'?5:m.finish==='Interference'?2:-1;
  win.pop=clamp(win.pop+momentum+Math.round((quality-65)/15),0,100);
  loser.pop=clamp(loser.pop+(m.finish==='Clean'?-2:2)+Math.round((quality-70)/20),0,100);
  win.morale=clamp(win.morale+2,0,100);loser.morale=clamp(loser.morale+(m.finish==='Clean'?-1:1),0,100);
  let titleChange=null;
  if(m.titleId){const t=title(m.titleId);if(t){if(t.championId===loser.id){t.championId=win.id;t.history.push({name:win.name,week:state.week,event:`Gewann gegen ${loser.name} bei ${name}`});titleChange=`${win.name} gewinnt ${t.name}!`}else if(!t.championId){t.championId=win.id;t.history.push({name:win.name,week:state.week,event:`Gewann vakanten Titel bei ${name}`});titleChange=`${win.name} gewinnt den vakanten Titel!`}else{titleChange=`Titelverteidigung: ${person(t.championId)?.name||'Champion'} bleibt Champion`}}}
  if(story){story.heat=clamp(story.heat+(m.finish==='Interference'?9:m.finish==='Clean'?3:5)+Math.round((quality-70)/8),0,100);story.progress=clamp(story.progress+12,0,100);if(story.progress>=100)story.phase='Blowoff';else if(story.progress>=65)story.phase='Climax';else story.phase='Escalation';}
  matchResults.push({type:m.type,a:a.name,b:b.name,winner:win.name,loser:loser.name,finish:m.finish,quality,storyId:m.story,titleId:m.titleId,titleChange});
  matchScores.push(quality);
 });
 let segmentScores=draftSegments.map(s=>{const ps=(s.participants||[]).map(person).filter(Boolean);const skill=ps.length?ps.reduce((a,w)=>a+(w.mic*.45+w.charisma*.55),0)/ps.length:60;return clamp(Math.round(skill*.65+(ps.length?Math.max(...ps.map(w=>w.pop))*.2:55)+Math.min(Number(s.duration)||5,15)*.7+rand(-8,8)),20,100)});
 const matchAvg=matchScores.reduce((a,b)=>a+b,0)/Math.max(1,matchScores.length),segAvg=segmentScores.length?segmentScores.reduce((a,b)=>a+b,0)/segmentScores.length:60;
 const crowd=clamp(Math.round(state.roster.reduce((a,w)=>a+w.pop,0)/Math.max(1,state.roster.length)*.55+matchAvg*.25+segAvg*.2+rand(-4,4)),0,100);
 const pacing=clamp(Math.round(78-Math.max(0,draftMatches.length+draftSegments.length-7)*4+rand(-5,7)),25,100);
 const logic=clamp(Math.round(75+matchResults.filter(m=>m.finish==='Clean').length*2-matchResults.filter(m=>m.finish==='DQ'||m.finish==='No Contest').length*4+rand(-4,5)),20,100);
 const storytelling=clamp(Math.round(segAvg*.55+(state.storylines.length?state.storylines.reduce((a,s)=>a+s.heat,0)/state.storylines.length:50)*.45),0,100);
 const rating=clamp(Math.round(matchAvg*.3+storytelling*.25+crowd*.2+pacing*.15+logic*.1),0,100);
 const revenue=Math.round((state.fans*(0.25+crowd/2000))*(venue==='Stadium'?1.6:venue==='Major Arena'?1.25:venue==='TV Studio'?.65:1));
 state.money+=revenue;state.fans=clamp(Math.round(state.fans+(crowd-55)*220+rating*120),1000,99999999);
 const recap=rating>=85?'Eine herausragende Show! Die Crowd war voll dabei und die Card lieferte starke Momente.':rating>=70?'Eine solide Show mit einigen Highlights. Die Storylines entwickeln sich weiter.':rating>=55?'Eine durchwachsene Show. Einige Segmente brauchen stärkeren Aufbau.':'Die Show blieb hinter den Erwartungen zurück. Überarbeite Pacing, Matchups und Story-Fortschritt.';
 const show={id:id('show'),name,showType,venue,week:state.week,season:state.season,matches:matchResults,segments:draftSegments.map((s,i)=>({type:s.type,title:s.title,participants:(s.participants||[]).map(x=>person(x)?.name).filter(Boolean),duration:s.duration,rating:segmentScores[i]})),matchAvg:Math.round(matchAvg),storytelling,crowd,pacing,logic,rating,revenue,recap,finishedAt:new Date().toISOString()};
 state.shows.push(show);state.history.push({id:id('h'),week:state.week,title:`${name} abgeschlossen · ${rating}/100`,detail:`${matchResults.length} Matches · ${fmt(revenue)} Einnahmen · Crowd ${crowd}/100`,type:'show'});
 matchResults.forEach(m=>{state.history.push({id:id('h'),week:state.week,title:`${m.winner} besiegt ${m.loser}`,detail:`${m.type} · ${m.quality}/100 · Finish: ${m.finish}${m.titleChange?' · '+m.titleChange:''}`,type:'match'})});
 state.week++;if(state.week>4){state.week=1;state.season++}
 saveState();draftMatches=[];draftSegments=[];page='history';render();openShowResult(show);
}
function openShowResult(s){showModal(`<div class="modal-head"><div><div class="pill green">SHOW ABGESCHLOSSEN</div><h2 style="margin-top:8px">${esc(s.name)}</h2></div><button onclick="closeModal()">✕</button></div><div class="result">${[['Showrating',s.rating],['Crowd',s.crowd],['Matchschnitt',s.matchAvg]].map(([a,b])=>`<div class="card"><span class="muted tiny">${a}</span><strong>${b}/100</strong></div>`).join('')}</div><div class="card" style="margin:12px 0"><h3>Show-Recap</h3><p>${esc(s.recap)}</p><div class="grid2 tiny"><div><span class="muted">Storytelling</span><strong style="display:block">${s.storytelling}/100</strong></div><div><span class="muted">Pacing</span><strong style="display:block">${s.pacing}/100</strong></div><div><span class="muted">Booking-Logik</span><strong style="display:block">${s.logic}/100</strong></div><div><span class="muted">Einnahmen</span><strong style="display:block">${fmt(s.revenue)}</strong></div></div></div><h3>Match Results</h3>${s.matches.map(m=>`<div class="person"><div class="avatar">${m.quality>=85?'★':'W'}</div><div class="person-main"><strong>${esc(m.winner)} <span class="muted">def.</span> ${esc(m.loser)}</strong><small>${esc(m.type)} · ${esc(m.finish)}${m.titleChange?' · '+esc(m.titleChange):''}</small></div><span class="rating">${m.quality}</span></div>`).join('')}<div class="modal-actions"><button onclick="closeModal()">Weiter</button><button class="primary" onclick="closeModal();setPage('dashboard')">Zum Dashboard</button></div>`)}
function storylinesPage(){return `<div class="section-head"><div><h2>Storylines & Rivalitäten</h2><div class="muted tiny">Heat, Fortschritt und offene Fehden im Blick behalten.</div></div><button class="primary" onclick="openStory()">＋ Storyline erstellen</button></div>${state.storylines.length?`<div class="grid2">${state.storylines.map(s=>`<div class="panel"><div class="between"><span class="pill ${s.heat>=75?'red':'gold'}">${esc(s.phase)}</span><span class="rating">${s.heat}<span class="tiny muted"> heat</span></span></div><h3 style="margin-top:12px">${esc(s.name)}</h3><div class="tiny muted" style="margin-bottom:9px">${s.participants.map(x=>esc(person(x)?.name||'Unbekannt')).join(' · ')}</div><p class="tiny">${esc(s.notes)}</p><div class="progress"><span style="width:${s.progress}%"></span></div><div class="between tiny muted" style="margin-top:6px"><span>Fortschritt</span><span>${s.progress}%</span></div><div class="wrap" style="margin-top:12px"><button onclick="openStory('${s.id}')">Bearbeiten</button><button onclick="advanceStory('${s.id}')">＋ Fortschritt</button><button class="danger" onclick="endStory('${s.id}')">Beenden</button></div></div>`).join('')}</div>`:'<div class="empty">Noch keine Storylines. Erstelle deine erste Rivalität.</div>'}`}
function titlesPage(){return `<div class="section-head"><div><h2>Championships</h2><div class="muted tiny">Titelträger und historische Regentschaften.</div></div><button class="primary" onclick="openTitle()">＋ Titel erstellen</button></div><div class="grid2">${state.titles.map(t=>`<div class="panel"><div class="row"><div class="avatar champ">♛</div><div class="person-main"><strong>${esc(t.name)}</strong><small>${t.championId?esc(person(t.championId)?.name||'Unbekannt'):'Vakant'}</small></div></div><div class="between" style="margin:12px 0"><span class="pill gold">${t.history.length} Historieneinträge</span><button onclick="openTitle('${t.id}')">Verwalten</button></div><h3>Letzte Regentschaften</h3>${t.history.slice(-4).reverse().map(h=>`<div class="history-item"><strong>${esc(h.name)}</strong><div class="tiny muted">Woche ${h.week} · ${esc(h.event)}</div></div>`).join('')||'<div class="tiny muted">Noch keine Titelhistorie.</div>'}</div>`).join('')}</div>`}
function historyPage(){return `<div class="section-head"><div><h2>Karriere-Historie</h2><div class="muted tiny">Jede Show und wichtige Booking-Entscheidung an einem Ort.</div></div><button onclick="exportSave()">Save exportieren</button></div><div class="panel">${state.history.length?state.history.slice().reverse().map(h=>`<div class="history-item"><div class="between"><strong>${esc(h.title)}</strong><span class="pill">Woche ${h.week}</span></div><div class="tiny muted">${esc(h.detail)}</div></div>`).join(''):'<div class="empty">Noch keine Historie vorhanden.</div>'}</div><div class="panel" style="margin-top:14px"><h2>Abgeschlossene Shows</h2>${state.shows.length?state.shows.slice().reverse().map(s=>`<div class="person"><div class="avatar">★</div><div class="person-main"><strong>${esc(s.name)}</strong><small>Season ${s.season} · Woche ${s.week} · ${s.matches.length} Matches</small></div><span class="rating">${s.rating}</span><button onclick="viewSavedShow('${s.id}')">Details</button></div>`).join(''):'<div class="empty">Noch keine Shows abgeschlossen.</div>'}</div>`}

function openModal(content){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}

function openWrestler(wid=''){const w=person(wid)||{id:'',name:'',brand:'Independent',overall:70,ring:70,mic:70,charisma:70,pop:50,stamina:80,morale:75,alignment:'Face',status:'Healthy',contract:'Exclusive'};openModal(`<div class="modal-head"><h2>${wid?'Wrestler bearbeiten':'Wrestler hinzufügen'}</h2><button onclick="closeModal()">✕</button></div><form id="wForm" onsubmit="saveWrestler(event,'${wid}')"><div class="grid2">${field('Name','name',w.name)}${field('Herkunft / Promotion','brand',w.brand)}<div class="field"><label>Alignment</label><select name="alignment">${['Face','Heel','Tweener'].map(x=>`<option ${w.alignment===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status">${['Healthy','Injured','Suspended'].map(x=>`<option ${w.status===x?'selected':''}>${x}</option>`).join('')}</select></div>${[['ring','In-Ring Skill'],['mic','Mic Skills'],['charisma','Charisma'],['pop','Popularität'],['stamina','Ausdauer'],['morale','Moral']].map(([n,l])=>`<div class="field"><label>${l} (0–100)</label><input name="${n}" type="number" min="0" max="100" value="${w[n]}"></div>`).join('')}</div><div class="notice">Overall wird aus In-Ring Skill, Mic Skills und Charisma berechnet. Popularität und Moral entwickeln sich durch dein Booking.</div><div class="modal-actions">${wid?`<button type="button" class="danger" onclick="deleteWrestler('${wid}')">Wrestler löschen</button>`:''}<button type="button" onclick="closeModal()">Abbrechen</button><button class="primary" type="submit">Speichern</button></div></form>`)}
function saveWrestler(e,wid){e.preventDefault();const f=new FormData(e.target),v=Object.fromEntries(f.entries());if(!v.name.trim()){toast('Name fehlt.');return}const w={id:wid||id('w'),name:v.name.trim(),brand:v.brand||'Independent',alignment:v.alignment,status:v.status,ring:clamp(+v.ring,0,100),mic:clamp(+v.mic,0,100),charisma:clamp(+v.charisma,0,100),pop:clamp(+v.pop,0,100),stamina:clamp(+v.stamina,0,100),morale:clamp(+v.morale,0,100),contract:'Exclusive'};w.overall=Math.round(w.ring*.5+w.mic*.2+w.charisma*.3);const ix=state.roster.findIndex(x=>x.id===wid);if(ix>=0)state.roster[ix]=w;else{state.roster.push(w);state.history.push({id:id('h'),week:state.week,title:`${w.name} dem Roster hinzugefügt`,detail:`Overall ${w.overall} · ${w.alignment}`,type:'roster'})}persist();closeModal();toast('Wrestler gespeichert.')}
function deleteWrestler(wid){if(!confirm('Wrestler wirklich löschen? Storylines und Titel können dadurch verwaiste Einträge enthalten.'))return;state.roster=state.roster.filter(w=>w.id!==wid);state.titles.forEach(t=>{if(t.championId===wid)t.championId=null});state.storylines.forEach(s=>s.participants=s.participants.filter(x=>x!==wid));persist();closeModal();toast('Wrestler gelöscht.')}
function openStory(sid=''){const s=state.storylines.find(x=>x.id===sid)||{id:'',name:'',participants:[],phase:'Build',heat:50,progress:0,notes:''};openModal(`<div class="modal-head"><h2>${sid?'Storyline bearbeiten':'Storyline erstellen'}</h2><button onclick="closeModal()">✕</button></div><form onsubmit="saveStory(event,'${sid}')">${field('Storyline-Name','name',s.name)}<div class="field"><label>Teilnehmer (Mehrfachauswahl)</label><select name="participants" multiple size="6">${state.roster.map(w=>`<option value="${w.id}" ${s.participants.includes(w.id)?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>Phase</label><select name="phase">${['Build','Escalation','Climax','Blowoff','Aftermath'].map(x=>`<option ${s.phase===x?'selected':''}>${x}</option>`).join('')}</select></div>${field('Heat (0–100)','heat',s.heat,'number','min="0" max="100"')}</div>${field('Fortschritt (0–100)','progress',s.progress,'number','min="0" max="100"')}<div class="field"><label>Story-Notizen</label><textarea name="notes" rows="3">${esc(s.notes)}</textarea></div><div class="modal-actions"><button type="button" onclick="closeModal()">Abbrechen</button><button class="primary">Speichern</button></div></form>`)}
function saveStory(e,sid){e.preventDefault();const f=new FormData(e.target),v=Object.fromEntries(f.entries()),parts=Array.from(e.target.elements.participants.selectedOptions).map(o=>o.value);if(!v.name.trim()){toast('Storyline-Name fehlt.');return}const s={id:sid||id('s'),name:v.name.trim(),participants:parts,phase:v.phase,heat:clamp(+v.heat,0,100),progress:clamp(+v.progress,0,100),notes:v.notes||''};const ix=state.storylines.findIndex(x=>x.id===sid);if(ix>=0)state.storylines[ix]=s;else state.storylines.push(s);state.history.push({id:id('h'),week:state.week,title:`Storyline: ${s.name}`,detail:`${s.phase} · Heat ${s.heat}`,type:'story'});persist();closeModal();toast('Storyline gespeichert.')}
function advanceStory(sid){const s=state.storylines.find(x=>x.id===sid);if(!s)return;s.progress=clamp(s.progress+15,0,100);s.heat=clamp(s.heat+3,0,100);s.phase=s.progress>=100?'Blowoff':s.progress>=70?'Climax':s.progress>=35?'Escalation':'Build';state.history.push({id:id('h'),week:state.week,title:`Storyline fortgeschritten: ${s.name}`,detail:`${s.phase} · Fortschritt ${s.progress}% · Heat ${s.heat}`,type:'story'});persist()}
function endStory(sid){const s=state.storylines.find(x=>x.id===sid);if(!s)return;if(!confirm(`Storyline "${s.name}" beenden?`))return;state.storylines=state.storylines.filter(x=>x.id!==sid);state.history.push({id:id('h'),week:state.week,title:`Storyline beendet: ${s.name}`,detail:`Letzter Stand: ${s.progress}% Fortschritt, Heat ${s.heat}`,type:'story'});persist()}
function openTitle(tid=''){const t=state.titles.find(x=>x.id===tid)||{id:'',name:'',championId:null,history:[]};openModal(`<div class="modal-head"><h2>${tid?'Titel verwalten':'Titel erstellen'}</h2><button onclick="closeModal()">✕</button></div><form onsubmit="saveTitle(event,'${tid}')">${field('Titelname','name',t.name)}<div class="field"><label>Aktueller Champion</label><select name="championId"><option value="">Vakant</option>${wrestlerOptions(t.championId||'')}</select></div><div class="modal-actions">${tid?`<button type="button" class="danger" onclick="deleteTitle('${tid}')">Titel löschen</button>`:''}<button type="button" onclick="closeModal()">Abbrechen</button><button class="primary">Speichern</button></div></form>${tid?`<h3 style="margin-top:20px">Titelhistorie</h3>${t.history.slice().reverse().map(h=>`<div class="history-item"><strong>${esc(h.name)}</strong><div class="tiny muted">Woche ${h.week} · ${esc(h.event)}</div></div>`).join('')}`:''}`)}
function saveTitle(e,tid){e.preventDefault();const f=new FormData(e.target),v=Object.fromEntries(f.entries());if(!v.name.trim()){toast('Titelname fehlt.');return}let t=state.titles.find(x=>x.id===tid);if(!t){t={id:id('t'),name:v.name.trim(),championId:null,history:[]};state.titles.push(t)}if(t.championId!==v.championId){const champ=person(v.championId);t.championId=v.championId||null;if(champ)t.history.push({name:champ.name,week:state.week,event:'Champion manuell festgelegt'});state.history.push({id:id('h'),week:state.week,title:`Titel aktualisiert: ${t.name}`,detail:`Champion: ${champ?.name||'Vakant'}`,type:'title'})}t.name=v.name.trim();persist();closeModal();toast('Titel gespeichert.')}
function deleteTitle(tid){if(!confirm('Titel und seine Regentschaftshistorie löschen?'))return;state.titles=state.titles.filter(t=>t.id!==tid);persist();closeModal()}
function openSettings(){openModal(`<div class="modal-head"><h2>Karriere-Einstellungen</h2><button onclick="closeModal()">✕</button></div><form onsubmit="saveSettings(event)">${field('Promotion-Name','promotion',state.promotion)}<div class="field"><label>Spielmodus</label><select name="mode"><option value="career" ${state.mode==='career'?'selected':''}>Career – Fortschritt & Geschäft</option><option value="sandbox" ${state.mode==='sandbox'?'selected':''}>Sandbox – freies Booking</option></select></div><div class="notice">Die App speichert lokal in diesem Browser. Exportiere regelmäßig eine JSON-Sicherung, wenn dir dein Spielstand wichtig ist.</div><div class="modal-actions"><button type="button" class="danger" onclick="resetGame()">Neue Karriere starten</button><button type="button" onclick="closeModal()">Abbrechen</button><button class="primary">Speichern</button></div></form>`)}
function saveSettings(e){e.preventDefault();const f=new FormData(e.target);state.promotion=f.get('promotion').trim()||'My Promotion';state.mode=f.get('mode');persist();closeModal();toast('Einstellungen gespeichert.')}
function resetGame(){if(!confirm('Wirklich eine neue Karriere starten? Exportiere zuerst deinen Save, wenn du ihn behalten möchtest.'))return;state=clone(DEFAULT_STATE);saveState();draftMatches=[];draftSegments=[];page='dashboard';render();closeModal();toast('Neue Karriere gestartet.')}
function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`wbs-save-season-${state.season}-week-${state.week}.json`;a.click();URL.revokeObjectURL(url);toast('Savegame exportiert.')}
function importSave(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(data.version!==1||!Array.isArray(data.roster)||!Array.isArray(data.shows))throw new Error('Ungültiges Savegame');if(!confirm('Aktuellen Spielstand durch importierten Save ersetzen?'))return;state=data;saveState();draftMatches=[];draftSegments=[];render();toast('Savegame importiert.')}catch(err){alert('Import fehlgeschlagen: Datei ist kein gültiger WBS-Save.')}};reader.readAsText(file);e.target.value=''}
function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function rand(min,max){return Math.random()*(max-min)+min}
render();
</script>
</body>
</html>
